<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuSo - Get Involved</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --muso-cyan: #00ADEF;
            --muso-yellow: #FFF200;
            --muso-pink: #EC008C;
            --muso-dark: #231F20;
        }

        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f8f8f8;
            color: var(--muso-dark);
            background-image: radial-gradient(var(--muso-cyan) 1px, transparent 0), radial-gradient(var(--muso-pink) 1px, transparent 0);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .muso-card {
            background: white;
            border: 4px solid var(--muso-dark);
            box-shadow: 10px 10px 0px var(--muso-dark);
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            transition: all 0.3s ease;
            padding: 2rem;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .logo-placeholder {
            width: 150px;
            height: 60px;
            background: linear-gradient(135deg, var(--muso-cyan), var(--muso-pink));
            border: 3px solid var(--muso-dark);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: white;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            text-align: center;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            font-size: 0.875rem;
            font-weight: 600;
            opacity: 0.7;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .form-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .optional {
            color: #9ca3af;
        }

        .muso-input {
            border: 3px solid var(--muso-dark);
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            transition: all 0.2s;
            outline: none;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
        }

        .muso-input:focus {
            box-shadow: 4px 4px 0px var(--muso-cyan);
            transform: translate(-2px, -2px);
        }

        .btn-primary {
            background: var(--muso-cyan);
            color: white;
            border: 3px solid var(--muso-dark);
            padding: 14px;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 12px;
            box-shadow: 4px 4px 0px var(--muso-dark);
            transition: all 0.1s;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
        }

        .btn-primary:hover:not(:disabled) {
            background: #0095d1;
        }

        .btn-primary:active:not(:disabled) {
            box-shadow: 0px 0px 0px var(--muso-dark);
            transform: translate(4px, 4px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .dice-container {
            border: 3px dashed var(--muso-dark);
            border-radius: 16px;
            background: #fff;
            padding: 1.5rem;
            text-align: center;
            display: none;
        }

        .dice-container h2 {
            font-size: 1.25rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--muso-cyan);
            margin-bottom: 1rem;
        }

        .dice-box {
            width: 80px;
            height: 80px;
            background: var(--muso-yellow);
            border: 3px solid var(--muso-dark);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0 auto 1rem;
            user-select: none;
        }

        .activity-text {
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--muso-pink);
            min-height: 2rem;
        }

        .dice-footer {
            margin-top: 1rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            opacity: 0.5;
        }

        #status-message {
            display: none;
            margin-bottom: 1.25rem;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 700;
            text-align: center;
            border: 3px solid var(--muso-dark);
        }

        .hidden-form {
            display: none;
        }

        .demo-notice {
            background: #fff3cd;
            border: 3px solid var(--muso-dark);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .demo-notice strong {
            display: block;
            margin-bottom: 0.5rem;
            color: #856404;
        }
    </style>
</head>
<body>

    <div class="muso-card">
        <div class="header">
                <img src="MusologinSVG.svg" alt="MuSo logo" style="width:180px;height:100px;object-fit:contain;display:block;">
            <h1 id="mainTitle">Join the Solution</h1>
            <p id="subTitle" class="subtitle">Empowering future changemakers</p>
        </div>

        <!-- Demo Mode Notice -->
        <div id="demoNotice" class="demo-notice" style="display: none;">
            <strong>⚠️ Demo Mode Active</strong>
            Data won't be saved. Please configure your Google Script URL in the code.
        </div>

        <div id="status-message"></div>

        <form id="musoForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required class="muso-input" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="organization">Organization</label>
                <input type="text" id="organization" name="organization" required class="muso-input" placeholder="Company name">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required class="muso-input" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="phone">Phone <span class="optional">(Optional)</span></label>
                    <input type="tel" id="phone" name="phone" class="muso-input" placeholder="+91 ...">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-primary">
                what's my muso mission?
            </button>
        </form>

        <!-- Result Component -->
        <div id="diceSection" class="dice-container">
            <h2>Your Assigned Mission</h2>
            <div id="dice" class="dice-box">?</div>
            <div id="activityDisplay" class="activity-text">
                Picking your activity...
            </div>
            <p class="dice-footer">Ready to change the world?</p>
        </div>
    </div>

    <script>
        // ✅ Google Script URL configured
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyNZNOJS3zIAtB-ezcj0ygrAP_TYWUlzC8B3WxKJvnOnb2yzHBIFWvrVc1Qikdw51L4xQ/exec';

        const activities = {
            1: "Solution Sketching (Draw it out!)",
            2: "Rapid Prototyping (Grab some cardboard!)",
            3: "Community Mapping (Identify a local problem)",
            4: "Elevator Pitch (Explain it in 30 seconds)",
            5: "Resource Hunting (Find 3 recycled items)",
            6: "Design Thinking Sprint (Brainstorm 10 ideas)"
        };

        // DOM Elements
        const form = document.getElementById('musoForm');
        const diceSection = document.getElementById('diceSection');
        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');
        const statusMsg = document.getElementById('status-message');
        const submitBtn = document.getElementById('submitBtn');
        const demoNotice = document.getElementById('demoNotice');
        const dice = document.getElementById('dice');
        const activityDisplay = document.getElementById('activityDisplay');

        // Check if in demo mode
        const isPlaceholder = SCRIPT_URL === 'YOUR_GOOGLE_SCRIPT_WEB_APP_URL_HERE';
        
        if (isPlaceholder) {
            demoNotice.style.display = 'block';
        }

        // Form submission handler
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = "SENDING...";
            statusMsg.style.display = 'none';

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            try {
                // Only send to Google Script if URL is configured
                if (!isPlaceholder) {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                }

                // SUCCESS - Update UI
                form.classList.add('hidden-form');
                mainTitle.innerText = "You're in!";
                subTitle.innerText = "Your journey starts now.";
                demoNotice.style.display = 'none';
                
                statusMsg.style.display = 'block';
                statusMsg.style.background = "var(--muso-yellow)"; 
                statusMsg.style.color = '#000';
                statusMsg.innerText = isPlaceholder ? "✓ Demo Complete (Not Saved)" : "✓ Registration Complete";

                // Show mission assignment
                diceSection.style.display = 'block';
                
                // Random roll 1-6
                const roll = Math.floor(Math.random() * 6) + 1;
                
                dice.innerText = roll;
                activityDisplay.innerText = activities[roll];

            } catch (error) {
                console.error('Submission error:', error);
                
                statusMsg.style.display = 'block';
                statusMsg.style.background = '#FEE2E2';
                statusMsg.style.color = '#B91C1C';
                statusMsg.innerText = "⚠️ Connection error. Please try again.";
                
                submitBtn.disabled = false;
                submitBtn.innerText = "SEND TO MUSO";
            }
        });
    </script>
</body>
</html>
